name: MorghChat
version: '${version}'
main: me.ehsan.morghchat.MorghChat
api-version: '1.21'
author: Ehsan
softdepend: [LuckPerms, PlaceholderAPI]

commands:
  msg:
    description: Send a private message to a player
    usage: /msg <player> <message>
    aliases: [tell, w, whisper]
  reply:
    description: Reply to the last player who messaged you
    usage: /reply <message>
    aliases: [r]
  ignore:
    description: Toggle ignoring a player's messages
    usage: /ignore <player>
  unignore:
    description: Stop ignoring a player's messages
    usage: /unignore <player>
  channel:
    description: Switch between available chat channels
    usage: /channel <local|global|staff|donator|admin|highrank>
    aliases: [ch]
  clearchat:
    description: Clear local or global chat
    usage: /clearchat [local|global|staff|donator|admin|highrank]
    aliases: [cc]
  chathide:
    description: Toggle visibility of chat channels for yourself
    usage: /chathide [local|global|staff|donator|admin|highrank|all]
  staffchat:
    description: Toggle staff chat
    aliases: [sc]
  donatorchat:
    description: Toggle donator chat
    aliases: [dc]
  adminchat:
    description: Toggle admin chat
    aliases: [ac]
  highrankchat:
    description: Toggle high-rank chat
    aliases: [hc]
  gc:
    description: Toggle global chat
    aliases: [globalchat]
  chat:
    description: Manage chat, defaulting to local chat
    usage: /chat <clear|mute|unmute> [channel] [player]
  channelmutelist:
    description: List globally muted channels and muted players per channel
    usage: /channelmutelist [page]
    aliases: [cml, mutelist]
  spy:
    description: Monitor commands, private messages, anvils, signs and books locally
    usage: /spy <on|off|status|toggle> [commands|private-messages|anvils|signs|books]
  chatcolor:
    description: Open the Chat Color menu
    usage: /chatcolor
    aliases: [ccolor]
  morghchat:
    description: Reload config / admin subcommands
    usage: /morghchat <reload|info|help|inventory>
    aliases: [tc]
  stafflist:
    description: List online players with staff chat permission
    usage: /stafflist [list]
    aliases: [slist, staff]
  highranklist:
    description: List online players with high-rank chat permission
    usage: /highranklist [list]
    aliases: [hlist, highrank]
  adminlist:
    description: List online players with admin chat permission
    usage: /adminlist [list]
    aliases: [alist, admin]
  donatorlist:
    description: List online players with donator chat permission
    usage: /donatorlist [list]
    aliases: [dlist, donator]

permissions:
  morghchat.admin:
    description: Access to admin/reload commands
    default: op
  morghchat.chatcolor:
    description: Allows using the Chat Color GUI and applying chat colors
    default: false
  morghchat.chatcolor.custom.*:
    description: Allows every custom Chat Color formatting option
    default: false
    children:
      morghchat.chatcolor.custom: true
  morghchat.chatcolor.custom:
    description: Allows using custom MiniMessage chat formatting
    default: false
  morghchat.msg:
    description: Allows sending and receiving private messages
    default: true
  morghchat.ignore:
    description: Allows using the ignore system
    default: true
  morghchat.command.spy:
    description: Allows using the /spy command
    default: op
  morghchat.spy.*:
    description: Allows spying on every supported input type
    default: op
    children:
      morghchat.spy.commands: true
      morghchat.spy.private-messages: true
      morghchat.spy.anvils: true
      morghchat.spy.signs: true
      morghchat.spy.books: true
  morghchat.spy.commands:
    description: Allows spying on player commands
    default: op
  morghchat.spy.private-messages:
    description: Allows spying on private messages
    default: op
  morghchat.spy.anvils:
    description: Allows spying on anvil renames
    default: op
  morghchat.spy.signs:
    description: Allows spying on sign text
    default: op
  morghchat.spy.books:
    description: Allows spying on book text
    default: op
  morghchat.spy.autoenable:
    description: Automatically enable all permitted local spy sections on first join
    default: op
  morghchat.bypass.spy:
    description: Prevents this player's commands and private messages from being spied on
    default: false
  morghchat.interactive.item:
    description: Allows using the [item] and [i] interactive chat placeholders
    default: true
  morghchat.interactive.inventory:
    description: Allows using the [inv] interactive chat placeholder and viewing linked inventories
    default: true
  morghchat.clearchat.*:
    description: Allows clearing every MorghChat channel
    default: op
    children:
      morghchat.clearchat.local: true
      morghchat.clearchat.global: true
      morghchat.clearchat.staff: true
      morghchat.clearchat.donator: true
      morghchat.clearchat.admin: true
      morghchat.clearchat.highrank: true
  morghchat.clearchat.local:
    description: Allows clearing local gamemode chat
    default: op
  morghchat.clearchat.global:
    description: Allows clearing global chat
    default: op
  morghchat.clearchat.staff:
    description: Allows clearing staff chat
    default: op
  morghchat.clearchat.donator:
    description: Allows clearing donator chat
    default: op
  morghchat.clearchat.admin:
    description: Allows clearing admin chat
    default: op
  morghchat.clearchat.highrank:
    description: Allows clearing high-rank chat
    default: op
  morghchat.bypass.clearchat.*:
    description: Keeps previous chat visible for every clear-chat channel
    default: op
    children:
      morghchat.bypass.clearchat.local: true
      morghchat.bypass.clearchat.global: true
      morghchat.bypass.clearchat.staff: true
      morghchat.bypass.clearchat.donator: true
      morghchat.bypass.clearchat.admin: true
      morghchat.bypass.clearchat.highrank: true
  morghchat.bypass.clearchat.local:
    description: Bypass local gamemode chat clears
    default: op
  morghchat.bypass.clearchat.global:
    description: Bypass global chat clears
    default: op
  morghchat.bypass.clearchat.staff:
    description: Bypass staff chat clears
    default: op
  morghchat.bypass.clearchat.donator:
    description: Bypass donator chat clears
    default: op
  morghchat.bypass.clearchat.admin:
    description: Bypass admin chat clears
    default: op
  morghchat.bypass.clearchat.highrank:
    description: Bypass high-rank chat clears
    default: op
  morghchat.channel.global:
    description: Access to global chat
    default: op
  morghchat.channel.staff:
    description: Access to the network-wide staff channel
    default: op
  morghchat.channel.donator:
    description: Access to the network-wide donator channel
    default: false
  morghchat.channel.admin:
    description: Access to the network-wide admin channel
    default: op
  morghchat.channel.highrank:
    description: Access to the network-wide high-rank channel
    default: false
  morghchat.list.hide.*:
    description: Hide yourself from every staff/high-rank/admin/donator list
    default: false
    children:
      morghchat.list.hide.staff: true
      morghchat.list.hide.highrank: true
      morghchat.list.hide.admin: true
      morghchat.list.hide.donator: true
  morghchat.list.hide.staff:
    description: Hide yourself from the staff list
    default: false
  morghchat.list.hide.highrank:
    description: Hide yourself from the high-rank list
    default: false
  morghchat.list.hide.admin:
    description: Hide yourself from the admin list
    default: false
  morghchat.list.hide.donator:
    description: Hide yourself from the donator list
    default: false
  morghchat.bypass.list.hide:
    description: See players who have chosen to hide from channel lists
    default: op
  morghchat.bypass.mute:
    description: Bypass all MorghChat mutes
    default: op
  morghchat.bypass.mute.global:
    description: Bypass global chat mutes
    default: op
  morghchat.bypass.mute.local:
    description: Bypass local chat mutes
    default: op
  morghchat.bypass.mute.staff:
    description: Bypass staff chat mutes
    default: op
  morghchat.bypass.mute.donator:
    description: Bypass donator chat mutes
    default: op
  morghchat.bypass.mute.admin:
    description: Bypass admin chat mutes
    default: op
  morghchat.bypass.mute.highrank:
    description: Bypass high-rank chat mutes
    default: op
  morghchat.bypass.filter:
    description: Bypass spam/caps/flood/swear/advertisement filters
    default: op
  morghchat.bypass.spam:
    description: Bypass spam filter only
    default: op
  morghchat.bypass.flood:
    description: Bypass anti-flood filter
    default: op
  morghchat.bypass.caps:
    description: Bypass anti-caps normalization
    default: op
  morghchat.bypass.swear:
    description: Bypass the swear-word filter
    default: op
  morghchat.bypass.advertisement:
    description: Bypass the anti-advertisement filter
    default: op
  morghchat.alert.*:
    description: Receive every MorghChat filter alert
    default: op
    children:
      morghchat.alert.spam: true
      morghchat.alert.flood: true
      morghchat.alert.caps: true
      morghchat.alert.swear: true
      morghchat.alert.advertisement: true
  morghchat.alert.spam:
    description: Receive spam detection alerts
    default: op
  morghchat.alert.flood:
    description: Receive flood detection alerts
    default: op
  morghchat.alert.caps:
    description: Receive caps detection alerts
    default: op
  morghchat.alert.swear:
    description: Receive swear-word detection alerts
    default: op
  morghchat.alert.advertisement:
    description: Receive advertisement detection alerts
    default: op
  morghchat.channelmutelist:
    description: View the list of globally muted channels and muted players
    default: op
  morghchat.mention:
    description: Allows triggering @mentions
    default: true
  morghchat.chathide.*:
    description: Allows hiding every available chat channel for yourself
    default: op
    children:
      morghchat.chathide.local: true
      morghchat.chathide.global: true
      morghchat.chathide.staff: true
      morghchat.chathide.donator: true
      morghchat.chathide.admin: true
      morghchat.chathide.highrank: true
      morghchat.chathide.all: true
  morghchat.chathide.local:
    description: Allows hiding local gamemode chat for yourself
    default: true
  morghchat.chathide.global:
    description: Allows hiding global chat for yourself
    default: true
  morghchat.chathide.staff:
    description: Allows hiding staff chat for yourself
    default: true
  morghchat.chathide.donator:
    description: Allows hiding donator chat for yourself
    default: true
  morghchat.chathide.admin:
    description: Allows hiding admin chat for yourself
    default: true
  morghchat.chathide.highrank:
    description: Allows hiding high-rank chat for yourself
    default: true
  morghchat.chathide.all:
    description: Allows hiding all available chat channels for yourself
    default: true
